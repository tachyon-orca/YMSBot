name: Update Assets

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ratings:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: "pip"
          cache-dependency-path: requirements-maintenance.txt

      - name: Install Python Dependencies
        run: >-
          python -m pip install --only-binary=:all: --require-hashes -r requirements-maintenance.txt

      - name: Copy Secrets
        run: |
          echo "${{ secrets.ENV }}" > .env

      - name: Fetch Ratings
        run: |
          docker run --rm --network host --mount type=bind,source="$(pwd)",target=/mnt/output tachyorca/imdb_user_crawler:main get_ratings.py /mnt/output/yms_ratings.json

      - name: Update Ratings
        run: |
          python scripts/update_ratings.py assets/YMS_ratings.json yms_ratings.json

      - name: Fetch Watchlist
        run: |
          docker run --rm --network host --mount type=bind,source="$(pwd)",target=/mnt/output tachyorca/imdb_user_crawler:main download_watchlist.py /mnt/output/yms_watchlist.json

      - name: Update Watchlist
        run: |
          python scripts/update_ratings.py assets/YMS_watchlist.json yms_watchlist.json True

      - name: Check for Changes
        id: check_changes
        run: |
          git add assets/YMS_ratings.json assets/YMS_watchlist.json
          git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and Push Changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name 'tachyon-orca'
          git config --global user.email '152846110+tachyon-orca@users.noreply.github.com'
          git commit -m "Update ratings & watchlist"
          git push
